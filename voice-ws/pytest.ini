[pytest]
# Backend and voice-ws both own a top-level src package. Run them in separate
# pytest processes so collection cannot silently select the other runtime.
testpaths = tests
asyncio_mode = auto
addopts = --tb=short --strict-markers --import-mode=importlib
markers =
    unit: Unit tests
    integration: Runtime integration tests
    slow: Slow tests
filterwarnings =
    ignore::DeprecationWarning
pythonpath =
    .
    ..
