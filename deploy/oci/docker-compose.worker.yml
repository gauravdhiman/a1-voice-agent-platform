# LiveKit voice worker — OCI VM (always-on)
services:
  worker:
    image: ${WORKER_IMAGE:-us-central1-docker.pkg.dev/project-bb848762-18cb-4cd6-858/cognients/worker:latest}
    restart: always
    env_file:
      - .env.worker
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PYTHONPATH=/app
