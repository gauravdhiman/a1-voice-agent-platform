# voice-ws (Pipecat WebSocket worker) + Caddy on an always-on OCI VM.
#
# The voice-ws image is built on the VM from the repo source (synced by
# oci-deploy-voice-ws.sh), so this compose file must be run from a directory
# that contains `shared/`, `voice-ws/`, and this file. Caddy terminates TLS
# (auto Let's Encrypt) for voice.<domain> and reverse-proxies to voice-ws:7860.
#
# Required env file: .env.voice-ws (generated by gcp-env-from-cloud.py voice-ws).
# Inbound ports 80/443 must be open on the VM (OCI security list / iptables) and
# the voice.<domain> DNS A record must point at the VM public IP for Caddy to
# issue a certificate.
services:
  voice-ws:
    build:
      context: .
      dockerfile: voice-ws/Dockerfile
    restart: always
    env_file:
      - .env.voice-ws
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PYTHONPATH=/app
      - NLTK_DATA=/app/nltk_data
    # Oracle Always Free Ampere A1 tenancies currently have 2 OCPUs total.
    # Keep the worker bounded even if the VM has a larger shape during a
    # transition or on a paid tenancy.
    cpus: 2.0
    # No published host port — Caddy reaches voice-ws on the compose network.
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - voice-ws

volumes:
  caddy_data:
  caddy_config:
