global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: platform
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: monitoring
    static_configs:
      - targets:
          [
            prometheus:9090,
            loki:3100,
            tempo:3200,
            alertmanager:9093,
            blackbox:9115,
          ]
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
