<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Expected value lost to missed calls each week by business type</title>
<rect x="0" y="0" width="720" height="380" rx="20" fill="#0f172a"/>
<text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">EXPECTED VALUE LOST TO MISSED CALLS</text>
<text x="190" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" fill="#e2e8f0">Home services</text>
<rect x="200" y="92" width="427" height="40" rx="0" fill="#fbbf24"/>
<text x="413" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a">$800 a week</text>
<text x="190" y="208" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" fill="#e2e8f0">Dental practice</text>
<rect x="200" y="182" width="240" height="40" rx="0" fill="#fbbf24"/>
<rect x="440" y="182" width="240" height="40" rx="0" fill="#fbbf24" opacity="0.70"/>
<text x="560" y="208" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a">$450 to $900 a week</text>
<text x="190" y="298" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" fill="#e2e8f0">Restaurant</text>
<rect x="200" y="272" width="192" height="40" rx="0" fill="#fbbf24"/>
<text x="404" y="298" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">$360 a busy weekend</text>
<text x="36" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">Figures from the math in this post. The dental bar shows a range, from one missed new patient call a week.</text>
</svg>
