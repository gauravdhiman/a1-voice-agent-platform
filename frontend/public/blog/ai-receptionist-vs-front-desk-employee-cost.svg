<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <rect x="0" y="0" width="1200" height="630" fill="#0f172a"/>
  <text x="60" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">What answering the phone costs each month</text>
  <text x="60" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Employee figures from BLS median receptionist pay, May 2025</text>

  <text x="60" y="188" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Full-time, fully loaded</text>
  <rect x="380" y="158" width="700" height="44" fill="#f87171"/>
  <text x="400" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#1e293b">about $4,500/mo</text>

  <text x="60" y="296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Full-time, wages only</text>
  <rect x="380" y="266" width="493" height="44" fill="#fbbf24"/>
  <text x="400" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#1e293b">$3,168/mo</text>

  <text x="60" y="404" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Part-time, wages only</text>
  <rect x="380" y="374" width="246" height="44" fill="#fbbf24"/>
  <text x="400" y="406" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#1e293b">$1,584/mo</text>

  <text x="60" y="512" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">AI receptionist</text>
  <rect x="380" y="482" width="47" height="44" fill="#34d399"/>
  <text x="452" y="514" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#f8fafc">$79 - 299/mo</text>

  <text x="60" y="586" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#94a3b8">Fully loaded adds benefits at about 30% of total compensation (BLS, June 2026). The AI bar is tiny because it covers 168 hours a week, not 40.</text>
</svg>
