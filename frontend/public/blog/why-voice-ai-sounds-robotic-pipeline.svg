<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img">
<title>Older voice AI pipeline versus speech-native voice AI</title>
<rect x="0" y="0" width="720" height="380" rx="20" fill="#0f172a"/>
<text x="36" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#f1f5f9">How voice AI turns speech into a reply</text>
<text x="36" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">OLDER PIPELINE</text>
<rect x="36" y="108" width="140" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="106.0" y="141.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Your speech</text>
<text x="188" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">→</text>
<rect x="200" y="108" width="140" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="270.0" y="141.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Written text</text>
<text x="352" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">→</text>
<rect x="364" y="108" width="150" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="439.0" y="141.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Language model</text>
<text x="526" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">→</text>
<rect x="538" y="108" width="146" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="611.0" y="141.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Spoken reply</text>
<text x="36" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fbbf24">Tone, pace, and emotion are lost when speech becomes text.</text>
<line x1="36" y1="222" x2="684" y2="222" stroke="#334155" stroke-width="1"/>
<text x="36" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">SPEECH-NATIVE</text>
<rect x="36" y="268" width="200" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="136.0" y="301.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Audio in</text>
<text x="248" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">→</text>
<rect x="260" y="268" width="200" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="360.0" y="301.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Audio understanding</text>
<text x="472" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#64748b">→</text>
<rect x="484" y="268" width="200" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="584.0" y="301.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f1f5f9">Audio out</text>
<text x="36" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2dd4bf">Tone and timing stay in the audio from start to finish.</text>
</svg>