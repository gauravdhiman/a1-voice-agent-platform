<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <rect x="0" y="0" width="1200" height="630" fill="#0f172a"/>
  <text x="60" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">Answering the phone: what it costs a restaurant each month</text>
  <text x="60" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Typical U.S. ranges, before benefits, payroll tax, and turnover</text>

  <text x="60" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Extra host to answer phones</text>
  <rect x="380" y="162" width="533" height="44" fill="#f87171"/>
  <text x="400" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#1e293b">$2,400 - 3,200/mo</text>

  <text x="60" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Answering service</text>
  <rect x="380" y="282" width="250" height="44" fill="#fbbf24"/>
  <text x="657" y="314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#f8fafc">$300 - 1,500/mo</text>

  <text x="60" y="432" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">AI receptionist</text>
  <rect x="380" y="402" width="50" height="44" fill="#34d399"/>
  <text x="457" y="434" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#f8fafc">$79 - 299/mo</text>

  <text x="60" y="540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#94a3b8">The host figure is wages only. Ranges move with your market; the gap between the bars does not.</text>
  <text x="60" y="574" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#94a3b8">The AI and answering-service bars are tiny because the phone gets answered 24/7, not 40 hours a week.</text>
</svg>
