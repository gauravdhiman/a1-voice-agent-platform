name: Promote to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA that already passed staging validation"
        required: true
        type: string

# Production is never deployed by a push to main. Configure the GitHub
# ``production`` environment with required reviewers before enabling this job.
permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  validate-production-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate immutable promotion ref
        env:
          PROMOTION_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          if [[ ! "$PROMOTION_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Production promotion requires the full 40-character commit SHA that passed staging." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Require a main commit with successful application and agent checks
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.ref }}'.toLowerCase();
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${sha}...main`
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed('The release SHA must be an ancestor of protected main.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: sha, per_page: 100
            });
            for (const path of ['.github/workflows/application-checks.yml', '.github/workflows/agent-evals.yml']) {
              const matching = runs.filter(run => run.path === path && run.head_sha === sha && run.event === 'push');
              matching.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
              if (matching[0]?.conclusion !== 'success') {
                core.setFailed(`A successful main push run is required for ${path} at the exact release SHA.`);
              }
            }

  migrate-production:
    runs-on: ubuntu-latest
    needs: validate-production-ref
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.PRODUCTION_GCP_PROJECT_ID || 'project-bb848762-18cb-4cd6-858' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud for managed secret access
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Render migration environment from managed secrets
        run: |
          config_file=deploy/config/production.env
          python3 scripts/deploy/validate-versioned-config.py \
            --config-file "$config_file" \
            --environment production \
            --project "$GCP_PROJECT_ID"
          secret_prefix="$(python3 scripts/deploy/read-env-cloud.py "$config_file" GCP_SECRET_NAME_PREFIX)"
          test -n "$secret_prefix" || {
            echo "GCP_SECRET_NAME_PREFIX is required in $config_file." >&2
            exit 1
          }
          python3 scripts/deploy/render-gcp-env.py \
            --config-file "$config_file" \
            --output .env.prod \
            --project "$GCP_PROJECT_ID" \
            --secret-prefix "$secret_prefix"

      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/deploy/requirements-migrations.txt

      - name: Check production migration compatibility
        run: python3 scripts/deploy/check_alembic_compatibility.py --env-file .env.prod

      - name: Run production database migrations
        run: |
          chmod +x scripts/deploy.sh scripts/deploy/run-alembic-cloud.sh scripts/deploy/run-alembic.sh
          ./scripts/deploy.sh migrate --env-file .env.prod

      - name: Verify phone-number data migration
        run: python3 scripts/deploy/verify_phone_number_backfill.py --env-file .env.prod

      - name: Verify organization credential migration
        run: python3 scripts/deploy/verify_org_credential_migration.py --env-file .env.prod

      - name: Verify Data API security
        run: python3 scripts/deploy/verify_data_api_security.py --env-file .env.prod

  deploy-gcp-production:
    runs-on: ubuntu-latest
    needs: migrate-production
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.PRODUCTION_GCP_PROJECT_ID || 'project-bb848762-18cb-4cd6-858' }}
      GCP_REGION: ${{ vars.PRODUCTION_GCP_REGION || 'us-central1' }}
      GCP_BACKEND_SERVICE: ${{ vars.PRODUCTION_GCP_BACKEND_SERVICE || 'backend-247ai' }}
      GCP_FRONTEND_SERVICE: ${{ vars.PRODUCTION_GCP_FRONTEND_SERVICE || 'frontend-247ai' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Pin deployment images to this commit
        run: echo "RELEASE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Render deployment environment from managed secrets
        run: |
          config_file=deploy/config/production.env
          python3 scripts/deploy/validate-versioned-config.py \
            --config-file "$config_file" \
            --environment production \
            --project "$GCP_PROJECT_ID"
          secret_prefix="$(python3 scripts/deploy/read-env-cloud.py "$config_file" GCP_SECRET_NAME_PREFIX)"
          test -n "$secret_prefix" || {
            echo "GCP_SECRET_NAME_PREFIX is required in $config_file." >&2
            exit 1
          }
          python3 scripts/deploy/render-gcp-env.py \
            --config-file "$config_file" \
            --output .env.prod \
            --project "$GCP_PROJECT_ID" \
            --secret-prefix "$secret_prefix"

      - name: Add production PostHog settings to the frontend build environment
        env:
          LEGACY_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          config_key="$(python3 scripts/deploy/read-env-cloud.py deploy/config/production.env NEXT_PUBLIC_POSTHOG_KEY 2>/dev/null || true)"
          config_host="$(python3 scripts/deploy/read-env-cloud.py deploy/config/production.env NEXT_PUBLIC_POSTHOG_HOST 2>/dev/null || true)"
          export POSTHOG_KEY="${config_key:-${LEGACY_POSTHOG_KEY:-}}"
          export POSTHOG_HOST="${config_host:-https://us.i.posthog.com}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(".env.prod")
          values = {
              "NEXT_PUBLIC_POSTHOG_KEY": os.environ.get("POSTHOG_KEY", ""),
              "NEXT_PUBLIC_POSTHOG_HOST": os.environ["POSTHOG_HOST"],
          }
          lines = [
              line
              for line in path.read_text().splitlines()
              if line.partition("=")[0].strip() not in values
          ]
          lines.extend(f"{key}={value}" for key, value in values.items())
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Install GCP deployment migration dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/deploy/requirements-migrations.txt

      - name: Deploy backend and frontend to production Cloud Run
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh gcp --env-file .env.prod

  deploy-voice-ws-production:
    runs-on: ubuntu-latest
    needs: deploy-gcp-production
    environment: production
    env:
      OCI_SSH_HOST: ${{ vars.PRODUCTION_OCI_SSH_HOST || '132.145.130.61' }}
      OCI_SSH_USER: ${{ vars.PRODUCTION_OCI_SSH_USER || 'ubuntu' }}
    steps:
      - name: Check production voice-ws configuration
        id: check-oci-ssh
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        shell: bash
        run: |
          if [[ -n "${OCI_SSH_HOST:-}" && -n "${OCI_SSH_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OCI production SSH configuration is incomplete; release failed." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check-oci-ssh.outputs.configured == 'true'
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare non-secret deployment config and SSH key
        if: steps.check-oci-ssh.outputs.configured == 'true'
        env:
          OCI_SSH_KEY_SECRET: ${{ secrets.OCI_SSH_KEY }}
        run: |
          cp deploy/config/production.env .env.prod
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY_SECRET" > ~/.ssh/oci_voice_ws
          chmod 600 ~/.ssh/oci_voice_ws

      - name: Deploy voice-ws to production OCI VM
        if: steps.check-oci-ssh.outputs.configured == 'true'
        env:
          OCI_SSH_KEY: ~/.ssh/oci_voice_ws
          SKIP_DEPLOYMENT_MIGRATIONS: "true"
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh voice-ws --env-file .env.prod
