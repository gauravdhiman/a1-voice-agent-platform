name: Migration graph

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-alembic:
    name: Verify Alembic graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/deploy/requirements-migrations.txt

      - name: Install migration tooling
        run: python -m pip install --disable-pip-version-check -r scripts/deploy/requirements-migrations.txt

      - name: Verify exactly one Alembic head
        run: python scripts/deploy/check_alembic_compatibility.py --repository-only
