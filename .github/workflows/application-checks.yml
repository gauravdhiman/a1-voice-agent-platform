name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: readiness
          POSTGRES_PASSWORD: isolated-ci-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d readiness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV_FILE: /dev/null
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://postgres:isolated-ci-test@127.0.0.1:5432/readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend, shared and deployment regression suites
        run: RATE_LIMIT_TEST_REDIS_URL=redis://127.0.0.1:6379/0 pytest backend/tests shared/tests scripts/tests -q
      - name: Bootstrap disposable Supabase-compatible database
        env:
          PGPASSWORD: isolated-ci-test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-test-db.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE service_role BYPASSRLS;
          GRANT USAGE ON SCHEMA public,auth TO anon,authenticated,service_role;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS
            $$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          CREATE PUBLICATION supabase_realtime;
          SQL
      - name: Apply preceding schema and exercise real security migration
        run: |
          (cd backend && alembic upgrade 20261012000001)
          DATA_API_TEST_DATABASE_URL="$DATABASE_URL" pytest backend/tests/integration/test_data_api_lockdown.py -q
      - name: Upgrade to head and verify security postconditions
        run: |
          (cd backend && alembic upgrade head)
          python scripts/deploy/check_alembic_compatibility.py --repository-only
          python scripts/deploy/verify_data_api_security.py --env-file /dev/null
          SETTLEMENT_TEST_DATABASE_URL="$DATABASE_URL" pytest backend/tests/integration/test_voice_settlement_sql.py -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:run
      - run: npm run build

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV_FILE: /dev/null
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r voice-ws/requirements-dev.txt
      - run: pytest voice-ws/tests -q
