name: Deploy Cloud (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: project-bb848762-18cb-4cd6-858
  GCP_REGION: us-central1
  # OCI voice-ws VM (public IP — not a secret; DNS: voice.247ai.live)
  OCI_SSH_HOST: 132.145.130.61
  OCI_SSH_USER: ubuntu

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write .env.prod from GitHub secret
        run: printf '%s\n' "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/deploy/requirements-migrations.txt

      - name: Run production database migrations
        run: |
          chmod +x scripts/deploy.sh scripts/deploy/run-alembic-cloud.sh scripts/deploy/run-alembic.sh
          ./scripts/deploy.sh migrate

  deploy-gcp:
    runs-on: ubuntu-latest
    needs: migrate-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .env.prod from GitHub secret
        run: printf '%s\n' "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Deploy backend and frontend to Cloud Run
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh gcp

  deploy-voice-ws:
    runs-on: ubuntu-latest
    needs: deploy-gcp
    steps:
      - name: Check OCI SSH configuration
        id: check-oci-ssh-key
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        shell: bash
        run: |
          if [[ -n "${OCI_SSH_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OCI_SSH_KEY is not configured; skipping voice-ws deployment."
          fi

      - uses: actions/checkout@v4
        if: steps.check-oci-ssh-key.outputs.configured == 'true'

      - name: Prepare .env.prod and SSH key
        if: steps.check-oci-ssh-key.outputs.configured == 'true'
        run: |
          printf '%s\n' "${{ secrets.ENV_PROD }}" > .env.prod
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_voice_ws
          chmod 600 ~/.ssh/oci_voice_ws

      - name: Deploy voice-ws to OCI VM
        if: steps.check-oci-ssh-key.outputs.configured == 'true'
        env:
          OCI_SSH_KEY: ~/.ssh/oci_voice_ws
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh voice-ws
