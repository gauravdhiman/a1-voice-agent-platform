version: "3.8"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "${HOST_OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${HOST_OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP
      - "${HOST_OTEL_HEALTH_PORT:-13133}:13133" # Health check
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - HOST_FRONTEND_PORT=${HOST_FRONTEND_PORT:-3000}
    networks:
      - saas-dev-network

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./.local-data/call-recordings:/app/.local-data/call-recordings
      - backend_cache:/app/.venv
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - RELOAD=true
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000","http://frontend-dev:3000"]}
      - GOOGLE_OAUTH_TOOL_REDIRECT_URI=${GOOGLE_OAUTH_TOOL_REDIRECT_URI:-http://localhost:8000/api/v1/tools/callback}
      - MCP_ALLOW_LOCAL_URLS=${MCP_ALLOW_LOCAL_URLS:-false}
      - VOICE_WS_PUBLIC_URL=${VOICE_WS_PUBLIC_URL:-ws://localhost:7860}
      - VOICE_WS_TWILIO_URL=${VOICE_WS_TWILIO_URL:-}
      - VOICE_RECORDING_ENABLED=${VOICE_RECORDING_ENABLED:-false}
      - VOICE_RECORDING_TEE=${VOICE_RECORDING_TEE:-false}
      - RECORDING_STORAGE_BACKEND=${RECORDING_STORAGE_BACKEND:-local}
      - RECORDING_STORAGE_LOCAL_ROOT=${RECORDING_STORAGE_LOCAL_ROOT:-.local-data/call-recordings}
      - RECORDING_ENCRYPTION_MODE=${RECORDING_ENCRYPTION_MODE:-provider_managed}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-90}
      - RECORDING_R2_ENDPOINT=${RECORDING_R2_ENDPOINT:-}
      - RECORDING_R2_BUCKET=${RECORDING_R2_BUCKET:-}
      - RECORDING_R2_ACCESS_KEY_ID=${RECORDING_R2_ACCESS_KEY_ID:-}
      - RECORDING_R2_SECRET_ACCESS_KEY=${RECORDING_R2_SECRET_ACCESS_KEY:-}
      - RECORDING_R2_PRESIGN_TTL_SECONDS=${RECORDING_R2_PRESIGN_TTL_SECONDS:-300}
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Google OAuth Configuration for Tools
      - GOOGLE_OAUTH_TOOL_CLIENT_ID=${GOOGLE_OAUTH_TOOL_CLIENT_ID}
      - GOOGLE_OAUTH_TOOL_CLIENT_SECRET=${GOOGLE_OAUTH_TOOL_CLIENT_SECRET}
      - GOOGLE_OAUTH_TOOL_REDIRECT_URI=${GOOGLE_OAUTH_TOOL_REDIRECT_URI}
      # LinkedIn direct OIDC sign-in (custom:linkedin in Supabase + backend broker)
      - SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_CLIENT_ID=${SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_CLIENT_ID}
      - SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_CLIENT_SECRET=${SUPABASE_AUTH_EXTERNAL_LINKEDIN_OIDC_CLIENT_SECRET}
      - LINKEDIN_OAUTH_SCOPES=${LINKEDIN_OAUTH_SCOPES:-openid profile email}
      # Token Refresh Service Configuration
      - TOKEN_REFRESH_CHECK_INTERVAL_MINUTES=${TOKEN_REFRESH_CHECK_INTERVAL_MINUTES:-5}
      - TOKEN_REFRESH_EXPIRY_WINDOW_MINUTES=${TOKEN_REFRESH_EXPIRY_WINDOW_MINUTES:-15}
      # Twilio Configuration
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      # OpenTelemetry Configuration
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=saas-platform-backend-dev
      # Traces
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TRACES_INSECURE=true
      # Metrics
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=true
      # Logs
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_LOGS_INSECURE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saas-dev-network
    depends_on:
      - otel-collector

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED}
        - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME}
        # Use HTTP/protobuf for frontend since it runs in browser
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:${HOST_OTEL_HTTP_PORT:-4318}/v1/traces
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://localhost:${HOST_OTEL_HTTP_PORT:-4318}/v1/metrics
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://localhost:${HOST_OTEL_HTTP_PORT:-4318}/v1/logs
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      # Explicitly set Supabase environment variables
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED}
      - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME}
      # Use HTTP/protobuf for frontend since it runs in browser
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://localhost:4318/v1/metrics}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://localhost:4318/v1/logs}
    depends_on:
      - backend-dev
      - otel-collector
    networks:
      - saas-dev-network

  # Pipecat WebSocket voice worker (Gemini Realtime + pipeline presets).
  voice-ws-dev:
    build:
      context: ./voice-ws
      dockerfile: Dockerfile.dev
    # Dev entrypoint starts the local Google Calendar REST connector (MCP) as a
    # co-process so Google_calendar_mcp (127.0.0.1:8733) works without extra setup.
    command: ["bash", "/app/entrypoint.dev.sh"]
    ports:
      - "${HOST_VOICE_WS_PORT:-7860}:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./voice-ws:/app
      - ./shared:/app/shared
      - ./.local-data/call-recordings:/app/.local-data/call-recordings
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PYTHONPATH=/app:/app/shared
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FISH_API_KEY=${FISH_API_KEY:-}
      - AGENT_DEFAULT_TIMEZONE=${AGENT_DEFAULT_TIMEZONE:-UTC}
      - VOICE_RECORDING_TEE=${VOICE_RECORDING_TEE:-false}
      - VOICE_RECORDING_ENABLED=${VOICE_RECORDING_ENABLED:-false}
      - RECORDING_STORAGE_BACKEND=${RECORDING_STORAGE_BACKEND:-local}
      - RECORDING_STORAGE_LOCAL_ROOT=${RECORDING_STORAGE_LOCAL_ROOT:-.local-data/call-recordings}
      - RECORDING_ENCRYPTION_MODE=${RECORDING_ENCRYPTION_MODE:-provider_managed}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-90}
      - RECORDING_R2_ENDPOINT=${RECORDING_R2_ENDPOINT:-}
      - RECORDING_R2_BUCKET=${RECORDING_R2_BUCKET:-}
      - RECORDING_R2_ACCESS_KEY_ID=${RECORDING_R2_ACCESS_KEY_ID:-}
      - RECORDING_R2_SECRET_ACCESS_KEY=${RECORDING_R2_SECRET_ACCESS_KEY:-}
      - RECORDING_R2_PRESIGN_TTL_SECONDS=${RECORDING_R2_PRESIGN_TTL_SECONDS:-300}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - MCP_HOST=127.0.0.1
      - MCP_PORT=8733
      - MCP_ALLOW_LOCAL_URLS=${MCP_ALLOW_LOCAL_URLS:-false}
    networks:
      - saas-dev-network
    restart: unless-stopped

volumes:
  backend_cache:

networks:
  saas-dev-network:
    driver: bridge
