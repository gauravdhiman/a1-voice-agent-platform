# Standalone operator stack; also merged by the isolated worktree launcher.
services:
  telemetry-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["chown", "10001:10001", "/var/lib/otelcol"]
    volumes: ["otel_queue:/var/lib/otelcol"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
  otel-collector:
    depends_on:
      telemetry-volume-init:
        condition: service_completed_successfully
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/observability/collector.yml:/etc/otel-collector-config.yml:ro
      - otel_queue:/var/lib/otelcol
    ports:
      - "127.0.0.1:${HOST_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${HOST_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${HOST_OTEL_HEALTH_PORT:-13133}:13133"
    mem_limit: 384m
    restart: unless-stopped
    networks: [saas-dev-network]
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=15d",
        "--storage.tsdb.retention.size=2GB",
      ]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/targets.json:/etc/prometheus/targets.json:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${HOST_PROMETHEUS_PORT:-9090}:9090"]
    mem_limit: 512m
    restart: unless-stopped
    networks: [saas-dev-network]
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 384m
    restart: unless-stopped
    networks: [saas-dev-network]
  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yml", "-target=all"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    mem_limit: 512m
    restart: unless-stopped
    networks: [saas-dev-network]
  alertmanager:
    image: prom/alertmanager:v0.34.0
    command:
      [
        "--config.file=/etc/alertmanager/config.yml",
        "--storage.path=/alertmanager",
      ]
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./deploy/observability/alertmanager.yml}:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:${HOST_ALERTMANAGER_PORT:-9093}:9093"]
    mem_limit: 128m
    restart: unless-stopped
    networks: [saas-dev-network]
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox.yml"]
    volumes: ["./deploy/observability/blackbox.yml:/etc/blackbox.yml:ro"]
    mem_limit: 64m
    restart: unless-stopped
    networks: [saas-dev-network]
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the local environment file}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${HOST_GRAFANA_PORT:-3300}:3000"]
    mem_limit: 384m
    restart: unless-stopped
    networks: [saas-dev-network]
volumes:
  otel_queue:
  prometheus_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  grafana_data:
networks:
  saas-dev-network:
    driver: bridge
