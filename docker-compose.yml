services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${HOST_BACKEND_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - PYTHONPATH=/app
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000","http://frontend-dev:3000"]}
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Google OAuth Configuration for Tools
      - GOOGLE_OAUTH_TOOL_CLIENT_ID=${GOOGLE_OAUTH_TOOL_CLIENT_ID}
      - GOOGLE_OAUTH_TOOL_CLIENT_SECRET=${GOOGLE_OAUTH_TOOL_CLIENT_SECRET}
      - GOOGLE_OAUTH_TOOL_REDIRECT_URI=${GOOGLE_OAUTH_TOOL_REDIRECT_URI:-http://localhost:8000/api/v1/tools/callback}
      # Token Refresh Service Configuration
      - TOKEN_REFRESH_CHECK_INTERVAL_MINUTES=${TOKEN_REFRESH_CHECK_INTERVAL_MINUTES:-5}
      - TOKEN_REFRESH_EXPIRY_WINDOW_MINUTES=${TOKEN_REFRESH_EXPIRY_WINDOW_MINUTES:-15}
      # Twilio Configuration
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - VOICE_WS_PUBLIC_URL=${VOICE_WS_PUBLIC_URL:-ws://localhost:7860}
      - VOICE_WS_TWILIO_URL=${VOICE_WS_TWILIO_URL:-}
      - VOICE_RECORDING_ENABLED=${VOICE_RECORDING_ENABLED:-false}
      - VOICE_RECORDING_TEE=${VOICE_RECORDING_TEE:-false}
      - RECORDING_STORAGE_BACKEND=${RECORDING_STORAGE_BACKEND:-local}
      - RECORDING_STORAGE_LOCAL_ROOT=${RECORDING_STORAGE_LOCAL_ROOT:-.local-data/call-recordings}
      - RECORDING_ENCRYPTION_MODE=${RECORDING_ENCRYPTION_MODE:-provider_managed}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-90}
      - RECORDING_R2_ENDPOINT=${RECORDING_R2_ENDPOINT:-}
      - RECORDING_R2_BUCKET=${RECORDING_R2_BUCKET:-}
      - RECORDING_R2_ACCESS_KEY_ID=${RECORDING_R2_ACCESS_KEY_ID:-}
      - RECORDING_R2_SECRET_ACCESS_KEY=${RECORDING_R2_SECRET_ACCESS_KEY:-}
      - RECORDING_R2_PRESIGN_TTL_SECONDS=${RECORDING_R2_PRESIGN_TTL_SECONDS:-300}
      # Production app telemetry is opt-in until the cloud collector endpoint
      # and credentials are provisioned. This app-only Compose file does not
      # start a collector; use docker-compose.observability.yml for the full
      # local stack or the cloud profile for production.
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_BACKEND_SERVICE_NAME:-247ai-backend}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-development}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_TRACES_INSECURE=${OTEL_EXPORTER_OTLP_TRACES_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=${OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_METRICS_HEADERS=${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=${OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_LOGS_INSECURE=${OTEL_EXPORTER_OTLP_LOGS_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_LOGS_HEADERS=${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
    networks:
      - saas-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED}
        - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://localhost:4318/v1/metrics}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-http/protobuf}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://localhost:4318/v1/logs}
        - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:-http/protobuf}
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      # Explicitly set Supabase environment variables
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED}
      - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://localhost:4318/v1/metrics}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-http/protobuf}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://localhost:4318/v1/logs}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:-http/protobuf}
    depends_on:
      - backend
    networks:
      - saas-network

  voice-ws:
    build:
      context: .
      dockerfile: voice-ws/Dockerfile
    ports:
      - "${HOST_VOICE_WS_PORT:-7860}:7860"
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - PYTHONPATH=/app:/app/shared
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FISH_API_KEY=${FISH_API_KEY:-}
      - AGENT_DEFAULT_TIMEZONE=${AGENT_DEFAULT_TIMEZONE:-UTC}
      - VOICE_RECORDING_TEE=${VOICE_RECORDING_TEE:-false}
      - VOICE_RECORDING_ENABLED=${VOICE_RECORDING_ENABLED:-false}
      - RECORDING_STORAGE_BACKEND=${RECORDING_STORAGE_BACKEND:-local}
      - RECORDING_STORAGE_LOCAL_ROOT=${RECORDING_STORAGE_LOCAL_ROOT:-.local-data/call-recordings}
      - RECORDING_ENCRYPTION_MODE=${RECORDING_ENCRYPTION_MODE:-provider_managed}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-90}
      - RECORDING_R2_ENDPOINT=${RECORDING_R2_ENDPOINT:-}
      - RECORDING_R2_BUCKET=${RECORDING_R2_BUCKET:-}
      - RECORDING_R2_ACCESS_KEY_ID=${RECORDING_R2_ACCESS_KEY_ID:-}
      - RECORDING_R2_SECRET_ACCESS_KEY=${RECORDING_R2_SECRET_ACCESS_KEY:-}
      - RECORDING_R2_PRESIGN_TTL_SECONDS=${RECORDING_R2_PRESIGN_TTL_SECONDS:-300}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - MCP_HOST=127.0.0.1
      - MCP_PORT=8733
      - VOICE_WS_WORKERS=${VOICE_WS_WORKERS:-1}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_VOICE_WS_SERVICE_NAME:-247ai-voice-ws}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-development}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_TRACES_INSECURE=${OTEL_EXPORTER_OTLP_TRACES_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=${OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_METRICS_INSECURE=${OTEL_EXPORTER_OTLP_METRICS_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_METRICS_HEADERS=${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=${OTEL_EXPORTER_OTLP_LOGS_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_LOGS_INSECURE=${OTEL_EXPORTER_OTLP_LOGS_INSECURE:-true}
      - OTEL_EXPORTER_OTLP_LOGS_HEADERS=${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
    networks:
      - saas-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  saas-network:
    driver: bridge
